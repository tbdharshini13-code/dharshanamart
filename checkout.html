<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Checkout | Dharshini Mart</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- HEADER -->

    <header class="home-header">

        <div class="home-logo">

            <a href="home.html">
                Dharshini Mart
            </a>

        </div>


        <nav class="home-nav">

            <a href="home.html">
                Home
            </a>

            <a href="cart.html">
                Cart 🛒
            </a>

        </nav>


        <div class="home-profile">

            <span>
                Hi, Buyer
            </span>

            <a href="login.html">
                Logout
            </a>

        </div>

    </header>



    <!-- CHECKOUT -->

    <main class="checkout-main">


        <div class="checkout-heading">

            <p class="section-label">
                ORDER CONFIRMATION
            </p>

            <h1>
                Checkout
            </h1>

            <p>
                Enter your delivery details to place your order.
            </p>

        </div>



        <div class="checkout-grid">


            <!-- DELIVERY DETAILS -->

            <section class="checkout-card">

                <h2>
                    Delivery Details
                </h2>


                <form id="checkoutForm">


                    <div class="checkout-input">

                        <label>
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>



                    <div class="checkout-input">

                        <label>
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter your phone number"
                            required
                        >

                    </div>



                    <div class="checkout-input">

                        <label>
                            Delivery Address
                        </label>

                        <textarea
                            id="address"
                            rows="4"
                            placeholder="Enter your complete address"
                            required
                        ></textarea>

                    </div>



                    <div class="checkout-input">

                        <label>
                            City
                        </label>

                        <input
                            type="text"
                            id="city"
                            placeholder="Enter your city"
                            required
                        >

                    </div>



                    <div class="checkout-input">

                        <label>
                            PIN Code
                        </label>

                        <input
                            type="text"
                            id="pincode"
                            placeholder="Enter PIN code"
                            required
                        >

                    </div>



                    <button
                        type="submit"
                        class="place-order-button"
                    >
                        Place Order
                    </button>


                </form>

            </section>



            <!-- ORDER SUMMARY -->

            <section class="checkout-card">

                <h2>
                    Order Summary
                </h2>


                <div id="checkoutItems">

                    Loading cart...

                </div>


                <div
                    id="checkoutTotal"
                    class="checkout-total"
                >

                    Total: ₹0

                </div>


            </section>


        </div>


    </main>



    <!-- FOOTER -->

    <footer class="home-footer">

        <p>
            © 2026 Dharshini Mart. All rights reserved.
        </p>

    </footer>



    <!-- CHECKOUT JAVASCRIPT -->

    <script>

        window.addEventListener("load", function () {


            const checkoutItems =
                document.getElementById("checkoutItems");


            const checkoutTotal =
                document.getElementById("checkoutTotal");


            const cart =
                JSON.parse(
                    localStorage.getItem("cart") || "[]"
                );


            if (cart.length === 0) {

                checkoutItems.innerHTML =
                    "<p>Your cart is empty.</p>";

                checkoutTotal.textContent =
                    "Total: ₹0";

                return;

            }


            checkoutItems.innerHTML = "";


            let total = 0;


            for (let i = 0; i < cart.length; i++) {


                const item =
                    cart[i];


                const quantity =
                    item.quantity || 1;


                const price =
                    parseInt(
                        String(item.price)
                        .replace(/\D/g, "")
                    ) || 0;


                const itemTotal =
                    price * quantity;


                total =
                    total + itemTotal;


                const product =
                    document.createElement("div");


                product.className =
                    "checkout-item";


                const name =
                    document.createElement("h3");

                name.textContent =
                    item.name;


                const quantityText =
                    document.createElement("p");

                quantityText.textContent =
                    "Quantity: " + quantity;


                const priceText =
                    document.createElement("strong");

                priceText.textContent =
                    "₹" +
                    itemTotal.toLocaleString("en-IN");


                product.appendChild(name);

                product.appendChild(quantityText);

                product.appendChild(priceText);


                checkoutItems.appendChild(product);

            }


            checkoutTotal.textContent =
                "Total: ₹" +
                total.toLocaleString("en-IN");


        });
        // =========================
// PLACE ORDER
// =========================

const checkoutForm =
    document.getElementById("checkoutForm");

if (checkoutForm) {

    checkoutForm.addEventListener("submit", function (event) {

        event.preventDefault();

        const name =
            document.getElementById("fullName").value.trim();

        const phone =
            document.getElementById("phone").value.trim();

        const address =
            document.getElementById("address").value.trim();

        const city =
            document.getElementById("city").value.trim();

        const pincode =
            document.getElementById("pincode").value.trim();


        if (
            name === "" ||
            phone === "" ||
            address === "" ||
            city === "" ||
            pincode === ""
        ) {

            alert("Please fill in all delivery details.");

            return;
        }


        alert(
            "Order placed successfully! Thank you for shopping with Dharshini Mart."
        );


        localStorage.removeItem("cart");


        window.location.href =
            "home.html";

    });

}


    </script>


</body>

</html>
