<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Seller Login | Dharshini Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <!-- Brand -->
            <div class="login-brand">

                <div class="login-logo">
                    D
                </div>

                <div>
                    <h2>Dharshini Mart</h2>
                    <p>Seller Account</p>
                </div>

            </div>


            <!-- Heading -->
            <div class="login-heading">

                <p class="login-label">
                    SELLER PORTAL
                </p>

                <h1>
                    Welcome, Seller
                </h1>

                <p>
                    Sign in to manage your products,
                    orders and store.
                </p>

            </div>


            <!-- Seller Login Form -->
            <form id="sellerLoginForm">

                <div class="input-group">

                    <label for="sellerEmail">
                        Email or Phone Number
                    </label>

                    <input
                        type="text"
                        id="sellerEmail"
                        placeholder="Enter your email or phone"
                    >

                </div>


                <div class="input-group">

                    <label for="sellerPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="sellerPassword"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            id="showSellerPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Options -->
                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="sellerRemember"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Login to Seller Panel
                </button>


                <!-- Seller Registration -->
                <p class="signup-text">

                    New seller?

                    <a href="#">
                        Register your store
                    </a>

                </p>

            </form>


            <!-- Back -->
            <a href="index.html" class="back-link">
                ← Back to role selection
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
