<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buyer Login | Dharshini Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Login Page -->

    <main class="login-page">

        <div class="login-box">

            <!-- Brand -->
            <div class="login-brand">

                <div class="login-logo">
                    D
                </div>

                <div>
                    <h2>Dharshini Mart</h2>
                    <p>Buyer Account</p>
                </div>

            </div>


            <!-- Heading -->

            <div class="login-heading">

                <p class="login-label">
                    WELCOME BACK
                </p>

                <h1>
                    Sign in to shop
                </h1>

                <p>
                    Access your account and continue
                    exploring Dharshini Mart.
                </p>

            </div>


            <!-- Login Form -->

            <form id="buyerLoginForm">

                <!-- Email -->

                <div class="input-group">

                    <label for="email">
                        Email or Phone Number
                    </label>

                    <input
                        type="text"
                        id="email"
                        placeholder="Enter your email or phone"
                    >

                </div>


                <!-- Password -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="password"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            id="showPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Remember + Forgot -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember me

                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login to Dharshini Mart
                </button>


                <!-- Divider -->

                <div class="divider">
                    <span>or continue with</span>
                </div>


                <!-- Social Login -->

                <div class="social-buttons">

                    <button
                        type="button"
                        class="social-button"
                    >
                        <strong>G</strong>
                        Continue with Google
                    </button>

                    <button
                        type="button"
                        class="social-button"
                    >
                        <strong></strong>
                        Continue with Apple
                    </button>

                </div>


                <!-- Sign Up -->

                <p class="signup-text">

                    New to Dharshini Mart?

                    <a href="#">
                        Create an account
                    </a>

                </p>

            </form>


            <!-- Back -->

            <a href="index.html" class="back-link">
                ← Back to role selection
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
