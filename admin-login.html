<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login | Dharshini Mart</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="login-page">

        <div class="login-box">

            <!-- Brand -->
            <div class="login-brand">

                <div class="login-logo">
                    D
                </div>

                <div>
                    <h2>Dharshini Mart</h2>
                    <p>Admin Portal</p>
                </div>

            </div>


            <!-- Heading -->
            <div class="login-heading">

                <p class="login-label">
                    ADMIN ACCESS
                </p>

                <h1>
                    Welcome, Admin
                </h1>

                <p>
                    Sign in to manage users, sellers,
                    products and marketplace activity.
                </p>

            </div>


            <!-- Admin Login Form -->
            <form id="adminLoginForm">

                <div class="input-group">

                    <label for="adminEmail">
                        Admin Email
                    </label>

                    <input
                        type="email"
                        id="adminEmail"
                        placeholder="Enter admin email"
                    >

                </div>


                <div class="input-group">

                    <label for="adminPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="adminPassword"
                            placeholder="Enter your password"
                        >

                        <button
                            type="button"
                            id="showAdminPassword"
                        >
                            Show
                        </button>

                    </div>

                </div>


                <!-- Login Button -->
                <button
                    type="submit"
                    class="login-button"
                >
                    Login to Admin Dashboard
                </button>


                <!-- Security Note -->
                <p class="signup-text">
                    Authorized administrators only.
                </p>

            </form>


            <!-- Back -->
            <a href="index.html" class="back-link">
                ← Back to role selection
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
